          type: string
          format: date-time

    CategoryBase:
      type: object
      description: 分类记录
      properties:
        id:
          type: string
          description: 主键
        name:
          type: string
          description: 分类名称
        desc:
          type: string
          description: 分类描述
        sort:
          type: integer
          description: 排序值
        user_id:
          type: string
          description: 创建人 ID
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApiItem:
      allOf:
        - $ref: "#/components/schemas/ApiBase"
        - type: object
          properties:
            category:
              $ref: "#/components/schemas/CategoryBase"

    CategoryItem:
      allOf:
        - $ref: "#/components/schemas/CategoryBase"
        - type: object
          properties:
            apis:
              type: array
              description: 分类下的接口列表
              items:
                $ref: "#/components/schemas/ApiBase"

    BmiData:
      type: object
