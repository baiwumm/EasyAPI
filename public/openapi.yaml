          description: 性别，M 男 / F 女
          enum: [M, F]
        province:
          $ref: "#/components/schemas/RegionCode"
        city:
          $ref: "#/components/schemas/RegionCode"
        area:
          $ref: "#/components/schemas/RegionCode"
        cardType:
          type: integer
          description: 证件类型，1 大陆 / 2 港澳台
          enum: [1, 2]
        cardText:
          type: string
          description: 证件类型文本
          examples: ["大陆"]
        address:
          type: string
          description: 籍贯地址
          examples: ["广东省湛江市雷州市"]
        age:
          type: integer
          description: 周岁
        constellation:
          type: string
          description: 星座

