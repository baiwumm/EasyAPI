        city:
          type: string
          description: 城市
        area:
          type: string
          description: 区县
        areaCode:
          type: string
          description: 区号
        postCode:
          type: string
          description: 邮政编码
          examples: ["518000"]

    TailwindPaletteData:
      type: object
      properties:
        color:
