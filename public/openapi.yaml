      additionalProperties: true
      properties:
        status:
          type: string
          description: success / fail
        query:
          type: string
          description: 查询的 IP
        country:
          type: string
          description: 国家
        countryCode:
          type: string
        region:
          type: string
          description: 省/州代码
        regionName:
          type: string
          description: 省/州名称
        city:
          type: string
          description: 城市
        zip:
          type: string
          description: 邮编
        lat:
          type: number
          description: 纬度
        lon:
          type: number
          description: 经度
        timezone:
          type: string
          description: 时区
        isp:
          type: string
          description: 运营商
        org:
          type: string
          description: 组织
        as:
          type: string
          description: 自治系统

    LicensePlateItem:
      type: object
      properties:
        province:
          type: string
          description: 省份
        city:
          type: string
          description: 城市
