          type: string
          description: 行政区划代码
        prefix:
          type: string
          description: 车牌前缀
          examples: ["粤B"]

    CrackTimes:
      type: object
      description: 四种攻击场景下的破解耗时
      properties:
        onlineThrottling100PerHour:
          description: 在线限流（100 次/小时）
        onlineNoThrottling10PerSecond:
          description: 在线不限流（10 次/秒）
        offlineSlowHashing1e4PerSecond:
          description: 离线慢哈希（1e4 次/秒）
        offlineFastHashing1e10PerSecond:
          description: 离线快哈希（1e10 次/秒）

    PasswordStrengthData:
      type: object
      description: zxcvbn 检测结果
      properties:
        password:
          type: string
          description: 原始密码
        score:
          type: integer
          description: 强度评分，0 最弱 ~ 4 最强
          minimum: 0
          maximum: 4
        guesses:
          type: number
          description: 预估猜测次数
        guessesLog10:
          type: number
          description: 猜测次数的 log10
        calcTime:
          type: integer
          description: 计算耗时（毫秒）
        crackTimesSeconds:
          $ref: "#/components/schemas/CrackTimes"
        crackTimesDisplay:
          $ref: "#/components/schemas/CrackTimes"
        feedback:
          type: object
          properties:
            warning:
              type: string
              description: 警告信息
            suggestions:
              type: array
              description: 改进建议
              items:
                type: string
        sequence:
          type: array
          description: 密码匹配模式序列
          items:
            type: object
            additionalProperties: true

    PostalCodeItem:
      type: object
      properties:
