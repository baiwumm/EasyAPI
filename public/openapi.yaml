  /api/postal-code:
    get:
      tags: [生活服务]
      operationId: getPostalCode
      summary: 邮政编码查询
      description: |
        `type=1` 按邮编精确查地区（返回单个对象）；`type=2` 按地区名称模糊查邮编（最多返回 20 条）。
        字典数据基本不变，响应可缓存一小时。
      parameters:
        - name: type
          in: query
          required: false
          description: 查询方式：1 邮编查地区，2 地区查邮编
          schema:
            type: integer
            enum: [1, 2]
            default: 1
        - name: keyword
          in: query
          required: true
          description: type=1 时为邮政编码，type=2 时为省/市/区名称
          schema:
            type: string
            examples: ["518000", "深圳"]
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/PostalCodeItem"
                          - type: array
                            description: type=2 时
                            items:
                              $ref: "#/components/schemas/PostalCodeItem"

  /api/qrcode:
    get:
      tags: [生活服务]
      operationId: getQrcode
      summary: 生成二维码
      description: |
        生成二维码。`format=png`（默认）返回 PNG 图片，`format=svg` 返回 SVG，`format=dataurl` 返回 JSON，`data` 为 Base64 Data URL。
      parameters:
        - name: text
          in: query
          required: true
          description: 二维码内容，最长 2000 个字符
          schema:
            type: string
            maxLength: 2000
            examples: ["https://api.baiwumm.com"]
        - name: format
          in: query
          required: false
          description: 输出格式
          schema:
            type: string
            enum: [png, svg, dataurl]
            default: png
        - name: size
          in: query
          required: false
          description: 图片尺寸（像素），64 ~ 1000
          schema:
            type: integer
            minimum: 64
            maximum: 1000
            default: 256
      responses:
        "200":
          description: format=png 返回 PNG，format=svg 返回 SVG，format=dataurl 返回 JSON；参数错误时返回 JSON 响应壳（code=500）
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                description: SVG 图片
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: string
                        description: format=dataurl 时的 Base64 Data URL
                        examples: ["data:image/png;base64,iVBORw0KGgo..."]

  /api/tailwind-color-palette:
    get:
      tags: [生活服务]
      operationId: getTailwindColorPalette
      summary: Tailwind 色板生成器
      description: 以指定颜色为基准生成 Tailwind 风格的 50 ~ 950 色阶。
      parameters:
        - name: color
          in: query
          required: true
          description: 基准颜色，支持 hex、rgb、hsl、hsv 及 CSS 颜色名
          schema:
            type: string
            examples: ["#3070ec"]
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TailwindPaletteData"

components:
  parameters:
    FormatText:
      name: format
      in: query
      required: false
      description: 传 `text` 时直接返回纯文本（text/plain），不传或其他值返回 JSON 响应壳
      schema:
        type: string
        enum: [text]
    PageIndex:
      name: pageIndex
      in: query
      required: false
      description: 页码，从 0 开始
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数，1 ~ 1000
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10

  responses:
    TextContentResponse:
      description: 请求成功；`format=text` 时为纯文本
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TextContentData"
        text/plain:
          schema:
            type: string
            description: 文案内容

  schemas:
    # ---------- 公共 ----------
    Envelope:
      type: object
      description: 统一响应壳
      required: [code, msg, data, timestamp]
      properties:
        code:
          type: integer
          description: "业务状态码：200 成功，-1 数据已存在，500 失败"
          examples: [200]
        msg:
          type: string
          description: 提示信息，失败时为错误原因
          examples: ["请求成功"]
        data:
          description: 业务数据，失败时为 null
        timestamp:
          type: integer
          format: int64
          description: 服务端毫秒时间戳
          examples: [1757952000000]

    PageMeta:
      type: object
      description: 分页信息
      properties:
        total:
          type: integer
          description: 总条数
        page:
          type: integer
          description: 当前页码（从 1 开始）
        pageSize:
          type: integer
          description: 每页条数

    TextContentData:
      type: object
      properties:
        content:
          type: string
          description: 文案内容

    # ---------- 每日推荐 ----------
    HitokotoData:
      type: object
      description: 一言句子（数据库整行返回，此处列出核心字段，其余字段以实际返回为准）
      additionalProperties: true
      properties:
        content:
          type: string
          description: 句子内容
        type:
          type: string
          description: 句子类型 a~l

    BingWallpaperData:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: 1080P 图片地址
        url_4k:
          type: string
          format: uri
          description: 4K 图片地址
        title:
          type: string
          description: 壁纸标题
        copyright:
          type: string
          description: 版权信息

    HolidayItem:
      type: object
      properties:
        name:
          type: string
          description: 节假日名称
          examples: ["国庆节"]
        start:
          type: string
          format: date
          description: 假期开始日期
        end:
          type: string
          format: date
          description: 假期结束日期
        distance:
          type: integer
          description: 假期开始日距今天数（负数表示已开始或已过）
        length:
          type: integer
          description: 假期总天数
        balance:
          type: integer
          description: 假期剩余天数（未开始为总天数，已结束为 0）
        work:
          type: array
          description: 调休上班日期
          items:
            type: string
            format: date

    SolarTermItem:
      type: object
      properties:
        name:
          type: string
          description: 节气名称
          examples: ["立春"]
        date:
          type: string
          description: 交节时间，格式 YYYY-MM-DD HH:mm:ss

    AlmanacHourItem:
      type: object
      properties:
        date:
          type: string
          format: date
          description: 公历日期
        hours:
          type: string
          description: 时段
          examples: ["23:00-00:59"]
        hour:
          type: string
          description: 时辰
          examples: ["子时"]
        yi:
          type: string
          description: 时宜（空格分隔）
        ji:
          type: string
          description: 时忌（空格分隔）
        chong:
          type: string
          description: 时冲
        sha:
          type: string
          description: 时煞
        nayin:
          type: string
          description: 纳音
        jiuxing:
          type: string
          description: 九星

    # ---------- 随机生成 ----------
    ColorItem:
      type: object
      properties:
        hex:
          type: string
          examples: ["#3070ec"]
        rgb:
          type: string
          examples: ["rgb(48, 112, 236)"]
        hsl:
          type: string
          examples: ["hsl(220, 83%, 56%)"]
        hsv:
          type: string
          examples: ["hsv(220, 80%, 93%)"]

    EmojiItem:
      type: object
      properties:
        emoji:
          type: string
          description: emoji 字符
          examples: ["😀"]
        name:
          type: string
          description: emoji 名称
          examples: ["grinning"]

    RandomUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 姓名
        gender:
          type: string
          description: 性别（男/女）
        username:
          type: string
          description: 用户名
        phone:
          type: string
          description: 手机号（11 位）
        email:
          type: string
          format: email
        avatar:
          type: string
          format: uri
          description: 头像地址
        birthday:
          type: string
          format: date
          description: 生日
        address:
          type: object
          properties:
            province:
              type: string
            city:
              type: string
            street:
              type: string
            zipCode:
              type: string
        company:
          type: string
          description: 公司
        job:
          type: string
          description: 职位
        website:
          type: string
          format: uri
        ip:
          type: string
          description: IPv4 地址
        createdAt:
          type: string
          format: date-time

    # ---------- 心灵语录 ----------
    ChinesePoetryData:
      type: object
      description: 诗词（数据库整行返回，此处列出核心字段，其余字段以实际返回为准）
      additionalProperties: true
      properties:
        title:
          type: string
          description: 标题
        author:
          type: string
          description: 作者
        paragraphs:
          type: array
          description: 诗句
          items:
            type: string

    ColdFactData:
      type: object
      properties:
        content:
          type: string
          description: 冷知识内容
        category:
          type: string
          description: 分类
        source:
          type: string
          description: 来源

    DiaryPoetryData:
      type: object
      properties:
        content:
          type: string
          description: 诗句
        origin:
          type: string
          description: 出处
        author:
          type: string
          description: 作者
        category:
          type: string
          description: 分类

    RiddleData:
      type: object
      properties:
        riddle:
          type: string
          description: 歇后语前半句
        answer:
          type: string
          description: 答案

    # ---------- 生活服务 ----------
    ApiBase:
      type: object
      description: 接口记录
      properties:
        id:
          type: string
          description: 主键
        category_id:
          type: string
          description: 所属分类 ID
        name:
          type: string
          description: 接口名称
        desc:
          type: string
          description: 接口描述
        path:
          type: string
          description: 接口路径
        method:
          type: string
          description: 请求方式
          enum: [GET, POST, PUT, DELETE, PATCH]
        operation_id:
          type: string
          description: 操作标识
        pinned:
          type: boolean
          description: 是否置顶
        is_featured:
          type: boolean
          description: 是否推荐
        sort:
          type: integer
          description: 排序值
        call_count:
          type: integer
          description: 调用次数
        last_called:
          type: [string, "null"]
          format: date-time
          description: 最后调用时间
        user_id:
          type: string
          description: 创建人 ID
        created_at:
          type: string
          format: date-time
