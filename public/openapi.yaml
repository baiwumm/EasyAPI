          enum: [体重过低, 正常体重, 超重, 肥胖]

    CountryCodeItem:
      type: object
      properties:
        name:
          type: string
          description: 中文名称
          examples: ["中国"]
        englishName:
          type: string
          description: 英文名称
          examples: ["China"]
        countryCode:
          type: string
          description: 国家代码
          examples: ["CN"]
        phoneCode:
          type: string
          description: 电话区号
          examples: ["86"]

    RegionCode:
      type: object
      properties:
        code:
