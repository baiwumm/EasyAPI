# EasyAPI 开放接口文档
# 维护约定：新增/修改接口时手动同步本文件（完整规范见仓库 docs/api-docs.md）
# 生成日期：2026-10-10
openapi: 3.1.0
info:
  title: EasyAPI 开放接口
  version: 2.8.1
  description: |
    EasyAPI 聚合平台开放接口，收录 30+ 个高频接口，公开接口无需鉴权。

    **统一响应壳**：所有 JSON 接口返回 `{ code, msg, data, timestamp }`。
    HTTP 状态码恒为 200，业务结果看 `code`：`200` 成功，`-1` 数据已存在，`500` 失败（失败时 `data` 为 `null`，`msg` 为错误原因）。

    **纯文本输出**：文案类接口支持 `format=text`，此时直接返回 `text/plain` 正文，不再包装响应壳。

    管理端接口（新增/修改/删除）未包含在本文档中。
  contact:
    name: 白雾茫茫丶
    url: https://baiwumm.com
servers:
  - url: https://api.baiwumm.com
    description: 生产环境
  - url: http://localhost:3000
    description: 本地开发
tags:
  - name: 每日推荐
    description: 每日更新或按日期/年份查询的内容
  - name: 随机生成
    description: 随机头像、颜色、字符串、用户等测试数据
  - name: 心灵语录
    description: 语录、诗词、笑话等文案类接口，均支持 format=text 直出纯文本
  - name: 生活服务
    description: 编码转换、信息查询等工具类接口

paths:
  # ==================== 每日推荐 ====================
  /api/hitokoto:
    get:
      tags: [每日推荐]
      operationId: getHitokoto
      summary: 每日一言
      description: 随机返回一条句子，支持按类型与长度筛选；`format=text` 时直接返回句子文本。
      parameters:
        - name: type
          in: query
          required: false
          description: |
            句子类型，多个用英文逗号分隔，可选值：
            a 动画、b 漫画、c 游戏、d 文学、e 原创、f 来自网络、g 其他、h 影视、i 诗词、j 网易云、k 哲学、l 抖机灵
          schema:
            type: string
            examples: ["a,d"]
        - name: minLength
          in: query
          required: false
          description: 句子最小长度，0 ~ 1000，且不能大于 maxLength
          schema:
            type: integer
            minimum: 0
            maximum: 1000
        - name: maxLength
          in: query
          required: false
          description: 句子最大长度，0 ~ 1000
          schema:
            type: integer
            minimum: 0
            maximum: 1000
        - $ref: "#/components/parameters/FormatText"
      responses:
        "200":
          description: 请求成功；`format=text` 时为纯文本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HitokotoData"
            text/plain:
              schema:
                type: string
                description: 句子文本

  /api/bing-wallpaper:
    get:
      tags: [每日推荐]
      operationId: getBingWallpaper
      summary: Bing 每日壁纸
      description: 返回当天 Bing 壁纸的 1080P 与 4K 地址，一天内结果不变；`format=text` 时直接返回 1080P 图片地址。
      parameters:
        - $ref: "#/components/parameters/FormatText"
      responses:
        "200":
          description: 请求成功；`format=text` 时为图片地址纯文本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BingWallpaperData"
            text/plain:
              schema:
                type: string
                description: 1080P 图片地址

  /api/holiday:
    get:
      tags: [每日推荐]
      operationId: getHoliday
      summary: 法定节假日
      description: 返回指定年份的法定节假日安排（含调休上班日、距今天数、假期余额）。结果一天内可缓存。
      parameters:
        - name: year
          in: query
          required: false
          description: 年份，范围 2022 ~ 当前年份，默认当前年份；超出范围自动钳制到边界
          schema:
            type: integer
            minimum: 2022
            examples: [2026]
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/HolidayItem"

  /api/solar-term:
    get:
      tags: [每日推荐]
      operationId: getSolarTerm
      summary: 二十四节气
      description: 返回指定年份的二十四节气及对应公历时间（按时间先后排序）。结果一天内可缓存。
      parameters:
        - name: year
          in: query
          required: false
          description: 四位年份，1900 ~ 2100，默认当前年份
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
            examples: [2026]
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SolarTermItem"

  /api/almanac:
    get:
      tags: [每日推荐]
      operationId: getAlmanac
      summary: 黄历时辰宜忌
      description: 返回指定日期十二时辰的宜忌、冲煞、纳音、九星（子时排首位）。结果一天内可缓存。
      parameters:
        - name: date
          in: query
          required: false
          description: 日期，格式 YYYY-MM-DD，默认今天
          schema:
            type: string
            format: date
            examples: ["2026-09-16"]
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        description: 十二时辰列表
                        items:
                          $ref: "#/components/schemas/AlmanacHourItem"

  # ==================== 随机生成 ====================
  /api/random-avatar:
    get:
      tags: [随机生成]
      operationId: getRandomAvatar
      summary: 随机头像
      description: |
        基于 DiceBear 生成 SVG 头像。`count=1`（默认）直接返回 SVG 图片；`count>1` 返回 JSON，`data` 为头像地址数组。
        同一 `seed` 生成结果固定，SVG 响应可长期缓存。
      parameters:
        - name: style
          in: query
          required: false
          description: 头像风格，`random` 为随机风格；非法值回退为 adventurer
          schema:
            type: string
            enum: [random, adventurer, avataaars, bottts, pixelArt, funEmoji, lorelei, micah, notionists, openPeeps, personas, thumbs]
            default: adventurer
        - name: seed
          in: query
          required: false
          description: 随机种子，相同种子生成相同头像；不传则随机
          schema:
            type: string
        - name: count
          in: query
          required: false
          description: 生成数量，1 ~ 20
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 1
        - name: size
          in: query
          required: false
          description: 头像尺寸（像素），16 ~ 512
          schema:
            type: integer
            minimum: 16
            maximum: 512
            default: 128
      responses:
        "200":
          description: count=1 返回 SVG 图片；count>1 返回 JSON 头像地址数组
          content:
            image/svg+xml:
              schema:
                type: string
                description: SVG 图片
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        description: 头像地址数组
                        items:
                          type: string
                          format: uri

  /api/random-color:
    get:
      tags: [随机生成]
      operationId: getRandomColor
      summary: 随机颜色
      description: 生成随机颜色。`format=all`（默认）返回包含 hex/rgb/hsl/hsv 的对象数组，指定单一格式时返回字符串数组。
      parameters:
        - name: format
          in: query
          required: false
          description: 返回格式
          schema:
            type: string
            enum: [all, hex, rgb, hsl, hsv]
            default: all
        - name: count
          in: query
          required: false
          description: 生成数量，1 ~ 50
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 1
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: array
                            description: format=all 时
                            items:
                              $ref: "#/components/schemas/ColorItem"
                          - type: array
                            description: 指定单一格式时
                            items:
                              type: string
                              examples: ["#3070ec"]

  /api/random-emoji:
    get:
      tags: [随机生成]
      operationId: getRandomEmoji
      summary: 随机 emoji
      parameters:
        - name: count
          in: query
          required: false
          description: 生成数量，1 ~ 50
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 1
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EmojiItem"

  /api/random-idcard:
    get:
      tags: [随机生成]
      operationId: getRandomIdcard
      summary: 随机身份证号
      description: 生成符合校验规则的随机 18 位身份证号（仅供测试）。
      parameters:
        - name: count
          in: query
          required: false
          description: 生成数量，1 ~ 50
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 1
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
                          description: 18 位身份证号

  /api/random-image:
    get:
      tags: [随机生成]
      operationId: getRandomImage
      summary: 随机图片
      description: 返回指定尺寸的随机图片地址数组。
      parameters:
        - name: count
          in: query
          required: false
          description: 生成数量，1 ~ 20
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
        - name: width
          in: query
          required: false
          description: 图片宽度（像素），16 ~ 1024
          schema:
            type: integer
            minimum: 16
            maximum: 1024
            default: 128
        - name: height
          in: query
          required: false
          description: 图片高度（像素），16 ~ 1024
          schema:
            type: integer
            minimum: 16
            maximum: 1024
            default: 128
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
                          format: uri

  /api/random-person:
    get:
      tags: [随机生成]
      operationId: getRandomPerson
      summary: 随机人物肖像
      description: 返回随机人物肖像图片地址数组。
      parameters:
        - name: count
          in: query
          required: false
          description: 生成数量，1 ~ 20
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
        - name: sex
          in: query
          required: false
          description: 性别
          schema:
            type: string
            enum: [generic, male, female]
            default: generic
        - name: size
          in: query
          required: false
          description: 图片尺寸（像素）
          schema:
            type: integer
            enum: [32, 64, 128, 256, 512]
            default: 128
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
                          format: uri

  /api/random-string:
    get:
      tags: [随机生成]
      operationId: getRandomString
      summary: 随机字符串
      description: 生成密码学安全的随机字符串，可按预设类型或自定义字符集生成。
      parameters:
        - name: length
          in: query
          required: false
          description: 字符串长度，1 ~ 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 16
        - name: count
          in: query
          required: false
          description: 生成数量，1 ~ 50
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 1
        - name: type
          in: query
          required: false
          description: |
            字符类型：alphanumeric 字母+数字、url-safe URL 安全 Base64、numeric 纯数字、
            distinguishable 易区分字符（去除 0/O、1/l）、hex 十六进制、base64、ascii-printable 可打印 ASCII
          schema:
            type: string
            enum: [alphanumeric, url-safe, numeric, distinguishable, hex, base64, ascii-printable]
            default: alphanumeric
        - name: characters
          in: query
          required: false
          description: 自定义字符集，传入后忽略 type 参数
          schema:
            type: string
            examples: ["abc123"]
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string

  /api/random-user:
    get:
      tags: [随机生成]
      operationId: getRandomUser
      summary: 随机用户
      description: 生成中文随机用户信息（姓名、手机号、邮箱、地址、公司等）。
      parameters:
        - name: count
          in: query
          required: false
          description: 生成数量，1 ~ 20
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 1
        - name: gender
          in: query
          required: false
          description: 性别；不传或其他值时随机
          schema:
            type: string
            enum: [male, female]
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RandomUser"

  # ==================== 心灵语录 ====================
  /api/chicken-soup:
    get:
      tags: [心灵语录]
      operationId: getChickenSoup
      summary: 毒鸡汤
      description: 随机返回一条毒鸡汤；`format=text` 时直接返回文本。
      parameters:
        - $ref: "#/components/parameters/FormatText"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"

  /api/chinese-poetry:
    get:
      tags: [心灵语录]
      operationId: getChinesePoetry
      summary: 飞花令
      description: 随机返回一首古诗词，可按作者筛选。
      parameters:
        - name: author
          in: query
          required: false
          description: 作者姓名，不传则不限
          schema:
            type: string
            examples: ["李白"]
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChinesePoetryData"

  /api/cold-fact:
    get:
      tags: [心灵语录]
      operationId: getColdFact
      summary: 每日冷知识
      description: 随机返回一条冷知识；`format=text` 时直接返回文本。
      parameters:
        - $ref: "#/components/parameters/FormatText"
      responses:
        "200":
          description: 请求成功；`format=text` 时为纯文本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ColdFactData"
            text/plain:
              schema:
                type: string

  /api/dairy-joke:
    get:
      tags: [心灵语录]
      operationId: getDairyJoke
      summary: 每日笑话
      description: 随机返回一条笑话；`format=text` 时直接返回文本。
      parameters:
        - $ref: "#/components/parameters/FormatText"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"

  /api/diary-poetry:
    get:
      tags: [心灵语录]
      operationId: getDiaryPoetry
      summary: 今日诗词
      description: 返回当天推荐的一句诗词（一天内结果不变）；`format=text` 时直接返回诗句文本。
      parameters:
        - $ref: "#/components/parameters/FormatText"
      responses:
        "200":
          description: 请求成功；`format=text` 时为纯文本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DiaryPoetryData"
            text/plain:
              schema:
                type: string

  /api/dog-diary:
    get:
      tags: [心灵语录]
      operationId: getDogDiary
      summary: 舔狗日记
      description: 随机返回一条舔狗日记；`format=text` 时直接返回文本。
      parameters:
        - $ref: "#/components/parameters/FormatText"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"

  /api/kfc:
    get:
      tags: [心灵语录]
      operationId: getKfc
      summary: 疯狂星期四
      description: 随机返回一条疯狂星期四文案；`format=text` 时直接返回文本。
      parameters:
        - $ref: "#/components/parameters/FormatText"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"

  /api/love-words:
    get:
      tags: [心灵语录]
      operationId: getLoveWords
      summary: 土味情话
      description: 随机返回一条土味情话；`format=text` 时直接返回文本。
      parameters:
        - $ref: "#/components/parameters/FormatText"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"

  /api/riddle:
    get:
      tags: [心灵语录]
      operationId: getRiddle
      summary: 歇后语
      description: 随机返回一条歇后语及其答案。
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RiddleData"

  /api/swearing:
    get:
      tags: [心灵语录]
      operationId: getSwearing
      summary: 骂人宝典（祖安语录）
      description: 随机返回一条祖安语录；`format=text` 时直接返回文本。
      parameters:
        - $ref: "#/components/parameters/FormatText"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"

  /api/tongue-twister:
    get:
      tags: [心灵语录]
      operationId: getTongueTwister
      summary: 每日绕口令
      description: 随机返回一条绕口令；`format=text` 时直接返回文本。
      parameters:
        - $ref: "#/components/parameters/FormatText"
      responses:
        "200":
          $ref: "#/components/responses/TextContentResponse"

  # ==================== 生活服务 ====================
  /api/apis:
    get:
      tags: [生活服务]
      operationId: getApis
      summary: 接口列表
      description: 分页查询平台收录的接口（含所属分类），按置顶、排序、推荐、创建时间降序。
      parameters:
        - $ref: "#/components/parameters/PageIndex"
        - $ref: "#/components/parameters/PageSize"
        - name: name
          in: query
          required: false
          description: 按接口名称模糊搜索
          schema:
            type: string
        - name: category_id
          in: query
          required: false
          description: 按分类 ID 筛选
          schema:
            type: string
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageMeta"
                          - type: object
                            properties:
                              list:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ApiItem"

  /api/categorys:
    get:
      tags: [生活服务]
      operationId: getCategorys
      summary: 接口分类列表
      description: 分页查询接口分类，每个分类内嵌其下全部接口（按置顶、排序、推荐、创建时间降序）。
      parameters:
        - $ref: "#/components/parameters/PageIndex"
        - $ref: "#/components/parameters/PageSize"
        - name: name
          in: query
          required: false
          description: 按分类名称模糊搜索
          schema:
            type: string
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageMeta"
                          - type: object
                            properties:
                              list:
                                type: array
                                items:
                                  $ref: "#/components/schemas/CategoryItem"

  /api/barcode:
    get:
      tags: [生活服务]
      operationId: getBarcode
      summary: 生成条形码
      description: |
        按指定编码格式生成条形码图片，`type` 决定返回 SVG 或 PNG。
        JsBarcode 选项按白名单透传：只接受下文登记的查询参数，未登记的一律忽略；数值类参数统一钳制到 0 ~ 500，
        颜色只放行十六进制（`#rgb`/`#rgba`/`#rrggbb`/`#rrggbbaa`）与 `transparent`/`currentcolor`/`black`/`white`，
        布尔类参数传 `true`/`1` 为真，其余值（含 `false`、`0`）为假。
      parameters:
        - name: text
          in: query
          required: true
          description: 条码内容，最长 200 个字符；EAN/UPC/ITF 类格式需符合位数要求，校验位可省略由系统补全
          schema:
            type: string
            maxLength: 200
            examples: ["HELLO123456"]
        - name: format
          in: query
          required: true
          description: |
            编码格式：CODE128 通用高密度、CODE39 工业物流、CODE93、EAN13 13 位商品码、EAN8 8 位商品码、
            UPC 北美商品码、ITF14 物流箱码、MSI 库存管理、pharmacode 制药、codabar 图书馆/血库（需以 A~D 开头结尾）
          schema:
            type: string
            enum: [CODE128, CODE39, CODE93, EAN13, EAN8, UPC, ITF14, MSI, pharmacode, codabar]
        - name: type
          in: query
          required: true
          description: 输出图片类型
          schema:
            type: string
            enum: [svg, png]
        - name: width
          in: query
          required: false
          description: 单条线宽（JsBarcode 选项），0 ~ 500
          schema:
            type: integer
            minimum: 0
            maximum: 500
        - name: height
          in: query
          required: false
          description: 条码高度（JsBarcode 选项），0 ~ 500
          schema:
            type: integer
            minimum: 0
            maximum: 500
        - name: margin
          in: query
          required: false
          description: 四边外边距（JsBarcode 选项），0 ~ 500
          schema:
            type: integer
            minimum: 0
            maximum: 500
        - name: marginTop
          in: query
          required: false
          description: 上外边距，0 ~ 500
          schema:
            type: integer
            minimum: 0
            maximum: 500
        - name: marginBottom
          in: query
          required: false
          description: 下外边距，0 ~ 500
          schema:
            type: integer
            minimum: 0
            maximum: 500
        - name: marginLeft
          in: query
          required: false
          description: 左外边距，0 ~ 500
          schema:
            type: integer
            minimum: 0
            maximum: 500
        - name: marginRight
          in: query
          required: false
          description: 右外边距，0 ~ 500
          schema:
            type: integer
            minimum: 0
            maximum: 500
        - name: textMargin
          in: query
          required: false
          description: 文字与条码间距，0 ~ 500
          schema:
            type: integer
            minimum: 0
            maximum: 500
        - name: fontSize
          in: query
          required: false
          description: 文字大小，0 ~ 500
          schema:
            type: integer
            minimum: 0
            maximum: 500
        - name: lineColor
          in: query
          required: false
          description: 条码线条颜色，仅十六进制或 transparent/currentcolor/black/white
          schema:
            type: string
            examples: ["#000000"]
        - name: background
          in: query
          required: false
          description: 背景色，仅十六进制或 transparent/currentcolor/black/white
          schema:
            type: string
            examples: ["#ffffff"]
        - name: displayValue
          in: query
          required: false
          description: 是否显示文字，true/1 为真，其余值为假
          schema:
            type: boolean
        - name: flat
          in: query
          required: false
          description: EAN13/EAN8 是否打印守卫条延伸出的辅助线，true/1 为真，其余值为假
          schema:
            type: boolean
        - name: font
          in: query
          required: false
          description: 文字字体（font-family），最长 64 字符
          schema:
            type: string
            maxLength: 64
            examples: ["monospace"]
        - name: fontOptions
          in: query
          required: false
          description: 文字样式
          schema:
            type: string
            enum: ["", bold, italic, "bold italic", "italic bold"]
        - name: textAlign
          in: query
          required: false
          description: 文字水平对齐
          schema:
            type: string
            enum: [left, center, right]
        - name: textPosition
          in: query
          required: false
          description: 文字位置
          schema:
            type: string
            enum: [top, bottom]
      responses:
        "200":
          description: type=svg 返回 SVG，type=png 返回 PNG；参数错误时返回 JSON 响应壳（code=500）
          content:
            image/svg+xml:
              schema:
                type: string
                description: SVG 图片
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

