shellEmulator: true

# 安装时不降级已锁定版本；pnpm 校验该字段只接受 off / no-downgrade
trustPolicy: off

# 字体切分工具链（cn-font-split 及其原生依赖）：构建期不需要跑 postinstall，
# 分片产物已随仓库提交（见 AGENTS.md Notes 的 split-font 说明）。
# pnpm 12 用 allowBuilds 映射：false = 有意跳过该包构建脚本——不声明的话
# pnpm 12 会以 ERR_PNPM_IGNORED_BUILDS 硬错误打断 Vercel 的 pnpm install
allowBuilds:
  cn-font-split: false
  koffi: false
  protobufjs: false

# 修复 Dependabot 告警（两条都在 dev 依赖链路，不进运行时 bundle）：
#   · get-uri 8.0.1 → 8.0.2：basic-ftp 5.3.1 有 DoS 告警且上游无 5.x 修复版，
#     只有 8.0.2 起才要求 basic-ftp ^6.2.4（链路 release-it → proxy-agent → get-uri）
#   · minimatch 11.x：由 eslint 10.15.0 与 @typescript-eslint 8.74.0 直接引入，不再有 10.x
overrides:
  get-uri: ^8.0.2

# @typescript-eslint 8.74.0 发布于 2026-11-23，未满 pnpm 默认的最小发布年龄
# （防供应链投毒）。这里显式豁免这一批同版本的包；等它们自然过期后
# 可以删掉本节，install 会照常通过。
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.74.0"
  - "@typescript-eslint/parser@8.74.0"
  - "@typescript-eslint/project-service@8.74.0"
  - "@typescript-eslint/scope-manager@8.74.0"
  - "@typescript-eslint/tsconfig-utils@8.74.0"
  - "@typescript-eslint/type-utils@8.74.0"
  - "@typescript-eslint/types@8.74.0"
  - "@typescript-eslint/typescript-estree@8.74.0"
  - "@typescript-eslint/utils@8.74.0"
  - "@typescript-eslint/visitor-keys@8.74.0"
