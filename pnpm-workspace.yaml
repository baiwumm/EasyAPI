shellEmulator: true

# 安装时不降级已锁定版本；pnpm 校验该字段只接受 off / no-downgrade
trustPolicy: off

# 字体切分工具链（cn-font-split 及其原生依赖）：构建期不需要跑 postinstall，
# 分片产物已随仓库提交（见 AGENTS.md Notes 的 split-font 说明）。
# pnpm 12 用 allowBuilds 映射：false = 有意跳过该包构建脚本——不声明的话
# pnpm 12 会以 ERR_PNPM_IGNORED_BUILDS 硬错误打断 Vercel 的 pnpm install
allowBuilds:
  cn-font-split: false
  koffi: false
  protobufjs: false

# 修复 Dependabot 告警（dev 依赖链路，仅是构建工具，不进 bundle）：
#   · get-uri 8.0.1 → 8.0.2 把 basic-ftp 拉到 6.2.4（上游唯一的修复版本）
#   · @eslint/config-array 0.23.5 → 0.23.6 把 minimatch 拉到 11.x
# 两处都是转录级补丁升级，升级后须跑齐 pnpm lint / typecheck / test 再提交。
overrides:
  get-uri: ^8.0.2
  "@eslint/config-array": ^0.23.6
