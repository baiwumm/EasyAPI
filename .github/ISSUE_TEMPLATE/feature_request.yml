name: 💡 Feature request
description: 提一个功能、新接口或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先描述问题，再说方案，讨论会容易得多。还比较发散的想法更适合放 [Discussions → Ideas](https://github.com/baiwumm/EasyAPI/discussions/categories/ideas)。

        想加新接口时请一并说明数据来源：自有 Supabase 表、第三方公开接口，还是可直接离线计算。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 新增接口 / 新标签页
        - 现有接口能力增强
        - 页面与交互
        - 后台管理
        - 登录与权限
        - 数据层 / RLS
        - 部署与环境变量
        - SEO / 接口文档
        - 文档与仓库
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 它解决什么问题
      description: 你现在遇到的情况，以及还有谁会受益。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: datasource
    attributes:
      label: 数据来源（新增接口时填）
      description: 上游接口地址与授权方式、自有表结构，或纯计算。涉及第三方时请确认其许可与限流允许服务端转发。
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 草图、链接、相关 issue 或 discussion。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue、discussion 与 docs。
          required: true
        - label: 这是一个诉求，不是多个需求打包。
          required: true
